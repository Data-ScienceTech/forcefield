[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forcefield"
version = "0.7.0"
description = "Zero-dependency AI security library -- prompt-injection detection, PII redaction, content safety, rate limiting, abuse detection, and tool governance for LLMs in 3 lines of Python."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Data Science Tech", email = "security@datasciencetech.ca"},
]
keywords = [
    "llm", "llm-security", "security", "prompt-injection", "pii",
    "ai-safety", "ai-firewall", "guardrails", "firewall", "redaction",
    "moderation", "content-safety", "content-moderation", "rate-limiting",
    "abuse-detection", "tool-governance", "tool-calling",
    "data-leakage", "data-loss-prevention",
    "openai", "chatgpt", "langchain", "agentic",
    "adversarial-attacks", "jailbreak", "prompt-guard",
    "sentinel", "command-scanning", "file-protection",
    "vibecoding", "ai-agent-guard", "vibe-coding",
    "constitution", "governance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.17.0",
    "sentence-transformers>=2.2.0",
]
ml-sklearn = [
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]
cloud = [
    "httpx>=0.25.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
fastapi = [
    "fastapi>=0.100.0",
]
all = [
    "forcefield[ml,cloud,langchain,fastapi]",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
forcefield = "forcefield.cli:main"

[project.urls]
Homepage = "https://datasciencetech.ca/en/python-sdk"
Documentation = "https://datasciencetech.ca/en/python-sdk"
Repository = "https://github.com/Data-ScienceTech/forcefield"
Issues = "https://github.com/Data-ScienceTech/forcefield/issues"
Changelog = "https://github.com/Data-ScienceTech/forcefield/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["forcefield*"]

[tool.setuptools.package-data]
forcefield = ["models/*.joblib", "models/*.onnx", "py.typed", "constitutions/*.yaml", "evals/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
